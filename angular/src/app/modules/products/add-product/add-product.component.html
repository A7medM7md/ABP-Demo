<form [formGroup]="productForm" (ngSubmit)="saveProduct()">
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Add Product</h5>
      <p class="card-text">Fill in the details to add a new product.</p>
    </div>
    <ul class="list-group list-group-flush">
      <li class="list-group-item">
        <div class="mb-3">
          <label for="nameAr" class="form-label">Name Arabic</label>
          <input type="text" class="form-control" id="nameAr" formControlName="nameAr" />
        </div>

        <div class="mb-3">
          <label for="nameEn" class="form-label">Name English</label>
          <input type="text" class="form-control" id="nameEn" formControlName="nameEn" />
        </div>

        <div class="mb-3">
          <label for="descriptionAr" class="form-label">Description Arabic</label>
          <textarea class="form-control" id="descriptionAr" rows="3" formControlName="descriptionAr"></textarea>
        </div>

        <div class="mb-3">
          <label for="descriptionEn" class="form-label">Description English</label>
          <textarea class="form-control" id="descriptionEn" rows="3" formControlName="descriptionEn"></textarea>
        </div>

        <div class="mb-3">
          <label for="categoryId" class="form-label">Category</label>
          <select class="form-select" id="categoryId" formControlName="categoryId">
            <option value="" disabled>Select a category</option>
            @for (category of categories; track $index) {
              <option [value]="category.id">{{ category.nameEn }}</option>
            }
          </select>
        </div>
      </li>

    </ul>

    <div class="card-body d-flex justify-content-between">
      <button type="submit" [disabled]="!productForm.valid" class="btn btn-primary">
        Save Product
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        Cancel
      </button>
    </div>
  </div>
</form>
